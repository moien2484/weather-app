<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/bootstrap-rtl.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=routine" />

    <title>Document</title>
</head>

<body class="bg-color-yellow" dir="rtl">


    <div class="row">
        <nav class="navbar navbar-light navbar-custom ">
            <form class="form-inline position-relative">
                <input class="form-control mr-sm-2 search-custom color-yellow ml-4" type="search"
                    placeholder="Search a city" aria-label="Search">
                <i class='bx bxs-search bx-tada bx-rotate-180 color-yellow position-absolute ml-4 ml-sm-1 '></i>
            </form>
            <a class="navbar-brand color-yellow navbar-text ">AccuWeather</a>

            <span class="material-symbols-outlined color-yellow position-absolute logo-custom">
                routine
            </span>
        </nav>
    </div>

    <div class="row">
        <div class="col-xl-3 col-lg-3 col-md-2 col-sm-1 col-1 "></div>
        <div class="col-xl-6 col-lg-6 col-md-8 col-sm-10 col-10 main-bg rounded mt-5">
            <ul class="list-group list-group-flush">
                <li class="list-group-item bg-transparenr list-group-custom text-center gradiant ">

                    <span class="date"></span>
                    the weather

                    <span class="clock"></span>
                </li>
                <li class="list-group-item bg-transparenr list-group-custom">

                    <div class="row">
                        <div
                            class="col-xl-6 col-lg-6 col-md-6 col-sm-12 d-flex justify-content-center align-items-center ">
                            <p class="name-city"></p>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-12">
                            <div
                                class="d-flex justify-content-md-end justify-content-center align-items-end position-relative">
                                <p class="temp-city"></p>
                                <i id="icon-weather"></i>
                                <div class="position-absolute" style="right: 117px; bottom: -10px; width: 100%;">
                                    <span id="text-feel" class="gradiant "></span>
                                    <span class="temp-feel gradiant"></span>
                                </div>
                            </div>
                        </div>
                    </div>


                </li>
                <li class="list-group-item bg-transparenr list-group-custom">
                    <div class="row">
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="color-yellow text-max-temp"> </span>
                            <span class="max-temp color-yellow"></span>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="color-yellow text-min-temp"> </span>
                            <span class="min-temp color-yellow"></span>
                        </div>
                    </div>
                </li>
                <li class="list-group-item bg-transparenr list-group-custom">
                    <div class="row">
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="speedwindtext color-yellow"></span>
                            <span class="windspeed color-yellow"></span>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="winddegreetext color-yellow"></span>
                            <span class="winddegree color-yellow"></span>
                        </div>

                    </div>
                </li>
                <li class="list-group-item bg-transparenr list-group-custom">
                    <div class="row">
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="visibilititext color-yellow"></span>
                            <span class="visibiliti color-yellow"></span>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="pressuretext color-yellow"></span>
                            <span class="pressure color-yellow"></span>
                        </div>

                    </div>

                </li>
                <li class="list-group-item bg-transparenr list-group-custom">
                    <div class="row">
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="humiditytext color-yellow"></span>
                            <span class="humidity color-yellow"></span>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 ">
                            <span class="sea_leveltext color-yellow"></span>
                            <span class="sea_level color-yellow"></span>
                        </div>

                    </div>
                </li>

            </ul>

        </div>
        <div class="col-xl-3 col-lg-3 col-md-2 col-sm-1 col-1 "></div>
    </div>







    <script src="/js/main.js"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
        integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
        crossorigin="anonymous"></script>
</body>

</html>
